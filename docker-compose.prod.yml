# ABOUTME: Docker Compose configuration for production environment
# ABOUTME: Deployed behind reverse proxy, no ports exposed directly

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/kasanova-io/forensics-backend:${IMAGE_TAG:-prod}
    container_name: ${BACKEND_CONTAINER:-forensics_backend_prod}
    expose:
      - '80'
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=https://forensics.kasanova.app
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - caddy_caddy_net
      - forensics_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        BACKEND_URL: http://backend:80
    image: ghcr.io/kasanova-io/forensics-frontend:${IMAGE_TAG:-prod}
    container_name: ${FRONTEND_CONTAINER:-forensics_frontend_prod}
    expose:
      - '3001'
    environment:
      - BACKEND_URL=http://backend:80
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # Slim image has no curl/wget; Node 22 has global fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Egress lockdown (post-CVE-2025-55182): the frontend only needs to reach
    # the backend and Caddy, so it sits solely on an internal network with no
    # internet route. Caddy joins forensics_internal via /opt/caddy compose.
    networks:
      - forensics_internal

networks:
  caddy_caddy_net:
    external: true
  forensics_internal:
    name: forensics_internal
    internal: true
